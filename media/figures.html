<!doctype html>
<!-- Source for the README figures. Edit here, then run: node media/render-figures.mjs -->
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Plantin;src:url(https://pi.dev/fonts/PlantinNowVariable-Upright.woff2) format("woff2");font-weight:200 800;font-style:normal}
@font-face{font-family:Plantin;src:url(https://pi.dev/fonts/PlantinNowVariable-Italic.woff2) format("woff2");font-weight:200 800;font-style:italic}
@font-face{font-family:Departure;src:url(https://pi.dev/fonts/DepartureMono-Regular.woff2) format("woff2")}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;-webkit-font-smoothing:antialiased}
figure{margin:0 0 40px;width:960px}

/* Terminal figures: Pi's dark theme colors */
.term{border-radius:10px;overflow:hidden;background:#15171c;border:1px solid #3a3f47}
.term .bar{height:30px;background:#24272e;display:flex;align-items:center;gap:8px;padding:0 12px}
.term .bar i{width:11px;height:11px;border-radius:50%;background:#ff5f57}
.term .bar i:nth-child(2){background:#febc2e}
.term .bar i:nth-child(3){background:#28c840}
.term .bar span{margin-left:10px;font:12px/1 -apple-system,"Segoe UI",sans-serif;color:#7e888e}
.term pre{margin:0;padding:14px 18px 16px;font:12px/1.6 "SF Mono",ui-monospace,Menlo,monospace;color:#dee0e1;white-space:pre}
.acc{color:#a798d7}.mut{color:#9da5a9}.dim{color:#7e888e}.ok{color:#68b78d}.warn{color:#cd9a22}.rule{color:#5a6369}

/* Concept figures: the video's paper, type and colors */
.paper{border-radius:8px;border:1px solid rgba(139,132,125,.5);padding:28px 36px 30px;color:#252f3d;font:16px/1 Departure,monospace;background-color:#ebe7e4;
  background-image:linear-gradient(rgba(75,96,124,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(75,96,124,.045) 1px,transparent 1px);background-size:20px 20px}
.kicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#5c5752;margin:0 0 26px}
.row{display:flex;align-items:center;white-space:pre;color:#384251}
.lab{width:200px;flex:none;color:#8b847d;font-size:12px;letter-spacing:.07em;text-transform:uppercase}
.seg{padding:0 1px 6px;margin-right:4px}
.seg.c{color:#4b607c;box-shadow:inset 0 -3px 0 #6a9fcc}
.seg.k{color:#4b607c;box-shadow:inset 0 -3px 0 rgba(106,159,204,.4)}
.seg.f{color:#844f3b;background:repeating-linear-gradient(135deg,rgba(184,107,82,0) 0 4px,rgba(184,107,82,.3) 4px 6px) bottom/100% 6px no-repeat;box-shadow:inset 0 -2px 0 #b86b52}
.seg.n{color:#8a5a12;background:rgba(225,176,110,.22);box-shadow:inset 0 -3px 0 #e1b06e}
.seg.wide{display:inline-flex;justify-content:space-between}
.res{display:flex;align-items:baseline;gap:10px;margin:10px 0 0 200px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:#8b847d}
.v{font:italic 400 26px/1 Plantin,Georgia,serif;letter-spacing:0;text-transform:none}
.v.bad{color:#844f3b}.v.good{color:#4b607c}
.grp{position:relative;display:inline-block;padding-bottom:30px}
.grp::after{content:"";position:absolute;left:1px;right:5px;bottom:17px;height:7px;border:1.5px solid #8b847d;border-top:0}
.grp em{position:absolute;left:0;right:0;bottom:0;text-align:center;font-style:normal;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:#5c5752}
.track{position:relative;flex:none;width:420px;height:22px;border:1.5px solid #8b847d;border-radius:2px;background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(139,132,125,.22) 6px 8px)}
.track b{position:absolute;left:0;top:0;bottom:0}
.track .pi{width:5%;background:#b86b52}
.track .us{width:100%;background:#6a9fcc}
.under{width:420px;margin:8px 0 0 200px;text-align:right;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:#844f3b}
.quote{margin:18px 0 0;font:italic 400 22px/1.3 Plantin,Georgia,serif;color:#252f3d}
.quote .mono{font:15px Departure,monospace;color:#8a5a12}
</style></head>
<body>

<script>
// ?fig=<id> keeps one figure and reports its height once the fonts load; render-figures.mjs reads it.
const id = new URLSearchParams(location.search).get("fig");
if (id) {
	for (const figure of document.querySelectorAll("figure")) if (figure.id !== id) figure.remove();
	const figure = document.getElementById(id);
	figure.style.marginBottom = "0";
	Promise.all([...document.fonts].map((font) => font.load())).then(
		() => { document.body.dataset.height = String(Math.ceil(figure.getBoundingClientRect().height)); },
		(error) => { document.body.dataset.error = String(error); },
	);
}
</script>
</body></html>
